# Publishes the app on GitHub Pages, through the gh-pages branch.
# One-time setup: repository Settings → Pages → Source: "Deploy from a branch", branch gh-pages, folder / (root).
# The branch also holds the pull request previews in pr-preview/ (see preview.yml): deploying keeps them.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: the app version is the number of commits on master (see vite.config.ts).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:all
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: app/dist
          retention-days: 1

  # Only this job can write to the repository, and it runs no build tool or dependency.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the site to the gh-pages branch
    steps:
      # The deploy action needs a git repository to work in.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ runner.temp }}/site
      # The site is served as built: without this file GitHub Pages would run Jekyll on it.
      - run: touch "$RUNNER_TEMP/site/.nojekyll"
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: ${{ runner.temp }}/site
          branch: gh-pages
          clean-exclude: pr-preview/
          # Rebase on the previews pushed in the meantime instead of overwriting them.
          force: false
          git-config-name: github-actions[bot]
          git-config-email: 41898282+github-actions[bot]@users.noreply.github.com
